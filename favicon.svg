<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141b0e" />
      <stop offset="1" stop-color="#0a0d08" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <rect x="2.5" y="2.5" width="59" height="59" rx="11.5" fill="none" stroke="#8FE20E" stroke-opacity="0.35" stroke-width="2" />
  <text x="32" y="43.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="30" letter-spacing="-1" fill="#8FE20E" filter="url(#glow)">HL</text>
</svg>
